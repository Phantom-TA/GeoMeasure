<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoMeasure</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/static/viewer.css">
</head>
<body>
  <aside id="panel">
    <header>
      <h1>GeoMeasure</h1>
      <nav><a href="/docs" target="_blank" rel="noopener">API docs</a></nav>
    </header>

    <form id="upload">
      <label id="drop" for="file">
        <input id="file" type="file" accept=".kml,.kmz,.zip">
        <strong>Drop a file here</strong>
        <span>.kml, .kmz, or a .zip containing a Shapefile</span>
      </label>
      <div class="options">
        <label>Strategy
          <select id="strategy">
            <option value="auto">auto</option>
            <option value="local">local</option>
            <option value="utm">utm</option>
          </select>
        </label>
        <label>CRS override
          <input id="crs" placeholder="e.g. EPSG:32643" autocomplete="off" spellcheck="false">
        </label>
      </div>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="summary" hidden>
      <h2 id="summary-title"></h2>
      <dl id="summary-list"></dl>
      <ul id="file-issues" class="issues"></ul>
    </section>

    <section id="features-section" hidden>
      <h2>Features <span id="feature-count" class="muted"></span></h2>
      <ol id="features"></ol>
    </section>

    <section id="recent-section">
      <h2>Recent files</h2>
      <ol id="recent"></ol>
    </section>
  </aside>
  <main id="map" aria-label="Map"></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/static/viewer.js"></script>
</body>
</html>
